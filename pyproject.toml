[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energycurves"
version = "1.0.0"
description = "Term structure, carry, gas storage and crack-spread analytics on NYMEX energy futures, built on public EIA data with a DuckDB SQL layer."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Tancrède Geli" }]
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.1",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
    "pyarrow==26.0.1",
    "duckdb==2.0.0",
]

[project.optional-dependencies]
fetch = ["xlrd==2.0.2", "yfinance==1.8.0"]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "mypy==2.4.1",
    "pandas-stubs==3.1.0.261029",
    "nbconvert==7.17.2",
    "nbformat==5.11.1",
    "ipykernel==7.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
energycurves = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PL", "NPY", "PD"]
ignore = [
    "PLR0913",  # finance functions legitimately take many parameters
    "PLR2004",  # magic numbers are financial constants documented in docstrings
    "N803",     # math notation (F, K, T) in argument names
    "N806",     # math notation in local variables
    "RUF001",   # unicode symbols (σ, κ, τ) in docstrings are intentional
    "RUF002",
    "RUF003",
    "PLC0415",  # lazy imports of optional dependencies
    "PD010",    # pivot is clearer than pivot_table for unique keys
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]
"scripts/*" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
files = ["src"]

[[tool.mypy.overrides]]
module = ["xlrd", "yfinance", "scipy", "scipy.*", "matplotlib", "matplotlib.*", "duckdb", "dateutil", "dateutil.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["energycurves"]
omit = ["src/energycurves/data/eia.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
