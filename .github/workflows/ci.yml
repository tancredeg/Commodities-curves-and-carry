name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Type check (mypy)
        run: mypy
      - name: Tests
        run: pytest --cov=energycurves --cov-report=term-missing
      - name: Sample integrity
        run: python scripts/fetch_data.py --check
      - name: README and docs numbers match the code
        run: python scripts/run_results.py --check
      - name: Demo notebook runs end to end
        run: jupyter nbconvert --to notebook --execute notebooks/demo.ipynb --output-dir /tmp
